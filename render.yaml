services:
  - type: web
    name: aiml-tutor-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aiml-tutor-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: aiml-tutor-redis
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: '["https://aiml-tutor-web.onrender.com"]'
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2

  - type: web
    name: aiml-tutor-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://aiml-tutor-api.onrender.com

  - type: keyvalue
    name: aiml-tutor-redis
    plan: free
    ipAllowList: []

databases:
  - name: aiml-tutor-db
    plan: free
